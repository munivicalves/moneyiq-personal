version: 2
updates:
  - package-ecosystem: maven
    directory: /backend/springboot-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /data-science
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
