
<style>
  #cls-card { background: #ffffff; color: #1e293b; padding: 16px; border-radius: 10px; }
  #cls-card p { color: #475569; }
  @media (prefers-color-scheme: dark) {
    #cls-card { background: #0f172a; color: #e2e8f0; }
    #cls-card p { color: #94a3b8; }
  }
</style>
<div id="cls-card">
<div id="cls" style="padding: 8px 0;"></div>
<p style="font: 12px/1.5 'Anthropic Sans', sans-serif; margin: 4px 0 12px;">
  Modelo de domínio com 8 entidades, todas no pacote <code>com.moneyiqpersonal.backend.model</code>.
  <strong>ContaBancaria</strong> e <strong>FaturaCartao</strong> foram as adições que completaram o modelo.
  Todas implementam <em>Serializable</em> e usam <em>@Entity</em>, <em>@Table</em> e <em>@Id</em>
  (Jakarta Persistence / Hibernate).
</p>
</div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    background: 'transparent',
    mainBkg: dark ? '#1e293b' : '#f1f5f9',
    primaryColor: dark ? '#1e293b' : '#f1f5f9',
    primaryTextColor: dark ? '#e2e8f0' : '#1e293b',
    primaryBorderColor: dark ? '#475569' : '#cbd5e1',
    secondaryColor: dark ? '#1e293b' : '#f1f5f9',
    tertiaryColor: dark ? '#0f172a' : '#ffffff',
    lineColor: dark ? '#94a3b8' : '#64748b',
    textColor: dark ? '#e2e8f0' : '#1e293b',
    edgeLabelBackground: dark ? '#0f172a' : '#ffffff',
    clusterBkg: dark ? '#0f172a' : '#f8fafc',
    clusterBorder: dark ? '#334155' : '#cbd5e1',
    attributeBackgroundColorOdd: dark ? '#1e293b' : '#f8fafc',
    attributeBackgroundColorEven: dark ? '#243044' : '#eef2f7',
    classText: dark ? '#e2e8f0' : '#1e293b',
  },
});
const { svg } = await mermaid.render('cls-svg', `classDiagram
  class Usuario {
    <<Entity>>
    -Long id
    -String nome
    -String email
    -String senhaHash
    -LocalDateTime dataCadastro
    -Boolean ativo
    -List~Transacao~ transacoes
    -List~DespesaFixa~ despesasFixas
    -List~CartaoCredito~ cartoes
    +getId() Long
    +getNome() String
    +getEmail() String
    +isAtivo() Boolean
  }

  class Transacao {
    <<Entity>>
    -Long id
    -Usuario usuario
    -TipoTransacao tipo
    -TipoReceita tipoReceita
    -CategoriaDespesa categoriaDespesa
    -Boolean despesaFixa
    -String descricao
    -BigDecimal valor
    -LocalDate dataTransacao
    -LocalDateTime dataCriacao
    +isReceita() boolean
    +isDespesa() boolean
  }

  class Categoria {
    <<Entity>>
    -Long id
    -String nome
    -String icone
    -String cor
    +getNome() String
    +getCor() String
  }

  class CartaoCredito {
    <<Entity>>
    -Long id
    -Usuario usuario
    -String nome
    -String bandeira
    -Integer diaVencimento
    -LocalDateTime dataCriacao
    -List~DespesaCartao~ despesas
  }

  class DespesaCartao {
    <<Entity>>
    -Long id
    -CartaoCredito cartaoCredito
    -FaturaCartao fatura
    -CategoriaDespesa categoriaDespesa
    -String descricao
    -BigDecimal valor
    -Integer parcelaAtual
    -Integer totalParcelas
    -String competencia
    -LocalDate dataCompra
  }

  class DespesaFixa {
    <<Entity>>
    -Long id
    -Usuario usuario
    -String descricao
    -BigDecimal valor
    -Integer diaVencimento
    -LocalDate dataInicio
    -LocalDate dataFim
    -Boolean indeterminado
    -StatusDespesaFixa status
  }

  class ContaBancaria {
    <<Entity>>
    -Long id
    -Usuario usuario
    -String nome
    -String banco
    -String agencia
    -String numeroConta
    -TipoConta tipoConta
    -BigDecimal saldoInicial
    -Boolean ativa
    -LocalDateTime dataCriacao
  }

  class FaturaCartao {
    <<Entity>>
    -Long id
    -CartaoCredito cartaoCredito
    -String competencia
    -BigDecimal valorTotal
    -LocalDate dataVencimento
    -Boolean paga
    -LocalDate dataPagamento
    -List~DespesaCartao~ despesas
  }

  class TipoTransacao {
    <<enumeration>>
    RECEITA
    DESPESA
  }

  Usuario "1" --> "0..*" Transacao : possui
  Usuario "1" --> "0..*" DespesaFixa : possui
  Usuario "1" --> "0..*" CartaoCredito : possui
  Usuario "1" --> "0..*" ContaBancaria : possui
  CartaoCredito "1" --> "0..*" DespesaCartao : registra
  CartaoCredito "1" --> "0..*" FaturaCartao : gera
  FaturaCartao "1" --> "0..*" DespesaCartao : agrupa
  Transacao --> TipoTransacao : tipo
`);
document.getElementById('cls').innerHTML = svg;

document.querySelectorAll('#cls svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
