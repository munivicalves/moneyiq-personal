# render.yaml – Infrastructure as Code para o Render
# Coloque este arquivo na RAIZ do repositório

services:
  - type: web
    name: sentinel-prime-api
    runtime: docker
    dockerfilePath: ./backend/springboot-api/Dockerfile
    plan: free
    region: oregon          # us-west-2 – melhor latência para BR no free tier
    healthCheckPath: /actuator/health

    envVars:
      - key: DB_URL
        fromDatabase:
          name: sentinel-prime-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sentinel-prime-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sentinel-prime-db
          property: password
      - key: JWT_SECRET
        generateValue: true     # Render gera automaticamente!
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"

databases:
  - name: sentinel-prime-db
    plan: free
    databaseName: sentinelprime
    user: sentinel_user
