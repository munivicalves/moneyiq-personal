spring.application.name=sentinel-prime

# ── Database (PostgreSQL) ──────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sentinelprime}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ────────────────────────────────────────────────────────────────────────
# ATENÇÃO: troque por uma string aleatória de 64+ caracteres em produção
jwt.secret=${JWT_SECRET:sentinelprime-secret-key-must-be-at-least-64-characters-long-for-hs512}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
