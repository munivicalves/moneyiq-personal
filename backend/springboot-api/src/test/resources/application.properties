# ── H2 in-memory para testes ───────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:moneyiqpersonal-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.frontend.url=http://localhost:5173

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-must-be-at-least-64-characters-long-for-hs512-algo
jwt.expiration=3600000
