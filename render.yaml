services:
  - type: web
    name: sentinel-prime-api
    runtime: docker
    dockerfilePath: ./backend/springboot-api/Dockerfile
    dockerContext: ./backend/springboot-api
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: sentinel-prime-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sentinel-prime-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sentinel-prime-db
          property: password
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

databases:
  - name: sentinel-prime-db
    plan: free
    databaseName: sentinelprime
    user: sentinel_user
